name: deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '18' }
      - name: Install deps
        run: cd functions && npm install
      - name: Deploy ALL
        run: npx firebase-tools deploy --only firestore:rules,functions,hosting --project sass-conseil-ia --force --token ${{ secrets.FIREBASE_TOKEN }}
