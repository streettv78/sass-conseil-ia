name: Deploy Firebase All
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '18' }
      - run: npm install -g firebase-tools
      - run: cd functions && npm install
      - run: firebase deploy --only firestore:rules,functions,hosting --project sass-conseil-ia --force --token ${{ secrets.FIREBASE_TOKEN }}
